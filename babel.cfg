# babel.cfg — string extraction for Flask-Babel.
# Extract:  pybabel extract -F babel.cfg -k _l -o translations/messages.pot .
# Init ar:  pybabel init  -i translations/messages.pot -d translations -l ar
# Update:   pybabel update -i translations/messages.pot -d translations
# Compile:  pybabel compile -d translations
[python: app/**.py]
[jinja2: templates/**.html]
